<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume-Job Matcher</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 950px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            background: #444;
        }

        /* Selected Resume */

        .file-box {
            width: 100%;
        }

        .selected-file {
            display: none;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding: 10px 14px;
            background: #f1f3f5;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        #fileName {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 10px;
        }

        #removeFile {
            width: 30px;
            height: 30px;
            margin: 0;
            padding: 0;
            border-radius: 50%;
            background: transparent;
            color: #555;
            font-size: 22px;
            line-height: 28px;
            flex-shrink: 0;
        }

        #removeFile:hover {
            background: #ddd;
            color: #222;
        }

        /* Loading */

        .loading {
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        /* Results */

        #result {
            margin-top: 25px;
            display: none;
        }

        .score-card {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            margin: 15px 0;
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #222;
            border-radius: 10px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .metric-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .metric-value {
            font-size: 25px;
            font-weight: bold;
            margin-top: 8px;
        }

        .skills-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .skills-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .skill {
            display: inline-block;
            padding: 7px 12px;
            margin: 4px;
            border-radius: 20px;
            background: #eef0f2;
            font-size: 14px;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .metrics,
            .skills-container {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <!-- Main Card -->

        <div class="card">

            <h1>AI Resume-Job Matcher</h1>

            <p class="subtitle">
                Analyze how well your resume matches a job description
            </p>


            <!-- Resume Upload -->

            <label for="resume">
                Upload Resume
            </label>

            <div class="file-box">

                <input
                    type="file"
                    id="resume"
                    accept=".pdf,.docx"
                    onchange="showSelectedFile()"
                >

                <div
                    id="selectedFile"
                    class="selected-file"
                >

                    <span id="fileName"></span>

                    <button
                        type="button"
                        id="removeFile"
                        onclick="removeResume()"
                        title="Remove resume"
                    >
                        ×
                    </button>

                </div>

            </div>


            <!-- Job Description -->

            <label for="jobDescription">
                Job Description
            </label>

            <textarea
                id="jobDescription"
                placeholder="Paste the job description here..."
            ></textarea>


            <!-- Analyze Button -->

            <button onclick="analyzeResume()">
                Analyze Resume
            </button>


            <!-- Loading -->

            <div
                class="loading"
                id="loading"
            >
                Analyzing your resume...
            </div>

        </div>


        <!-- Results -->

        <div id="result"></div>

    </div>


    <script>


        /* Show Selected Resume */

        function showSelectedFile() {

            const fileInput =
                document.getElementById("resume");

            const selectedFile =
                document.getElementById("selectedFile");

            const fileName =
                document.getElementById("fileName");


            if (fileInput.files.length > 0) {

                fileName.textContent =
                    fileInput.files[0].name;

                selectedFile.style.display = "flex";

            }

        }


        /* Remove Selected Resume */

        function removeResume() {

            document.getElementById("resume").value = "";

            document.getElementById("selectedFile")
                .style.display = "none";

            document.getElementById("fileName")
                .textContent = "";

        }


        /* Analyze Resume */

        async function analyzeResume() {

            const fileInput =
                document.getElementById("resume");

            const jobDescription =
                document.getElementById("jobDescription").value;

            const resultDiv =
                document.getElementById("result");

            const loadingDiv =
                document.getElementById("loading");

            if (fileInput.files.length === 0) {

                alert("Please upload a resume.");

                return;

            }


            if (jobDescription.trim() === "") {

                alert("Please enter a job description.");

                return;

            }

            const formData =
                new FormData();


            formData.append(
                "file",
                fileInput.files[0]
            );


            formData.append(
                "job_description",
                jobDescription
            );

            loadingDiv.style.display = "block";

            resultDiv.style.display = "none";


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:8000/analyze-resume",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();

                if (data.error) {

                    resultDiv.innerHTML = `

                        <div class="card">

                            <p>
                                ${data.error}
                            </p>

                        </div>

                    `;

                }


                else {
                    let matchedSkills =
                        data.matched_skills
                            .map(
                                skill =>
                                    `<span class="skill">${skill}</span>`
                            )
                            .join("");


                    

                    let missingSkills =
                        data.missing_skills
                            .map(
                                skill =>
                                    `<span class="skill">${skill}</span>`
                            )
                            .join("");


                    resultDiv.innerHTML = `

                        <!-- Overall Score -->

                        <div class="score-card">

                            <h2>
                                Resume Match Score
                            </h2>

                            <div class="score">

                                ${data.overall_match_score}%

                            </div>


                            <div class="progress-container">

                                <div
                                    class="progress-bar"
                                    style="width: ${data.overall_match_score}%"
                                ></div>

                            </div>

                        </div>


                        <!-- Metrics -->

                        <div class="metrics">


                            <div class="metric-card">

                                <div>
                                    Skill Match
                                </div>

                                <div class="metric-value">

                                    ${data.skill_match_score}%

                                </div>

                            </div>


                            <div class="metric-card">

                                <div>
                                    NLP Similarity
                                </div>

                                <div class="metric-value">

                                    ${data.text_similarity_score}%

                                </div>

                            </div>


                        </div>


                        <!-- Skills -->

                        <div class="skills-container">


                            <div class="skills-card">

                                <h3>
                                    Matched Skills
                                </h3>

                                ${
                                    matchedSkills ||
                                    "No matching skills found."
                                }

                            </div>


                            <div class="skills-card">

                                <h3>
                                    Missing Skills
                                </h3>

                                ${
                                    missingSkills ||
                                    "No missing skills."
                                }

                            </div>


                        </div>

                    `;


                    resultDiv.style.display =
                        "block";

                }

            }


            catch (error) {

                resultDiv.innerHTML = `

                    <div class="card">

                        <p>

                            Could not connect to the backend.
                            Make sure FastAPI is running.

                        </p>

                    </div>

                `;

                resultDiv.style.display =
                    "block";

            }


            loadingDiv.style.display =
                "none";

        }

    </script>

</body>

</html>
